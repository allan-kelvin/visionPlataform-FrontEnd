<div class="page">

  <!-- HEADER -->
  <div class="page-header">
    <div>
      <h2>Áreas</h2>
      <p>Gerencie as áreas cadastradas no sistema.</p>
    </div>

    <button mat-raised-button class="btn-primary" (click)="novo()">
      <mat-icon>add</mat-icon>
      Nova Área
    </button>
  </div>

  <!-- FILTROS -->
  <div class="filters">

    <div class="field">
      <label>ID</label>
      <input matInput [(ngModel)]="filtroId" placeholder="Buscar por ID">
    </div>

    <div class="field">
      <label>Descrição</label>
      <input matInput [(ngModel)]="filtroDescricao" placeholder="Buscar descrição">
    </div>

    <button class="btn-filter" (click)="aplicarFiltro()">
      Filtrar
    </button>

  </div>

  <!-- TABELA -->
  <div class="table-card">

    <table mat-table [dataSource]="dataSource">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let area">{{ area.id }}</td>
      </ng-container>

      <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef>Descrição</th>
        <td mat-cell *matCellDef="let area">{{ area.descricao }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef class="acoes-header">
          Ações
        </th>

        <td mat-cell *matCellDef="let area" class="acoes-cell">
          <div class="acoes-wrapper">

            <button class="btn-edit" (click)="editar(area.id)">
              <mat-icon>edit</mat-icon>
              Editar
            </button>

            <button class="btn-delete" (click)="excluir(area.id)">
              <mat-icon>delete</mat-icon>
              Excluir
            </button>

          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

    <mat-paginator [pageSize]="5"
                   [pageSizeOptions]="[5,10,20]">
    </mat-paginator>

  </div>

</div>
