<div class="page-header">

  <div class="title-wrapper">
    <button mat-icon-button class="btn-back" (click)="voltar()">
      <mat-icon>arrow_back</mat-icon>
    </button>

    <div>
      <h2>{{ id ? 'Editar Área' : 'Cadastrar Área' }}</h2>
      <p>Preencha as informações abaixo.</p>
    </div>
  </div>

</div>

<div class="form-card">

  <form [formGroup]="form">

    <div class="form-content">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descrição</mat-label>
        <input matInput formControlName="descricao" placeholder="Digite a descrição da área">
      </mat-form-field>

      <mat-slide-toggle formControlName="ativo">
        Ativo
      </mat-slide-toggle>

    </div>

    <div class="actions">

      <button mat-stroked-button (click)="voltar()">
        Cancelar
      </button>

      <button mat-raised-button class="btn-salvar" (click)="salvar()">
        Salvar
      </button>

    </div>

  </form>

</div>
