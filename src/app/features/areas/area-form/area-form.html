<div class="page-container">

  <!-- HEADER -->
  <div class="page-header">
    <h2>{{ id ? 'Editar Área' : 'Cadastrar Área' }}</h2>
    <p>Preencha as informações abaixo.</p>
  </div>

  <!-- FORM -->
  <form [formGroup]="form" (ngSubmit)="salvar()" class="form-card">

    <!-- CONTEÚDO -->
    <div class="form-content">

      <!-- DESCRIÇÃO -->
      <div class="field">
        <label>Descrição</label>

        <input
          type="text"
          formControlName="descricao"
          placeholder="Digite a descrição da área"
        />

        <!-- VALIDAÇÃO -->
        <span class="error"
          *ngIf="form.get('descricao')?.touched && form.get('descricao')?.invalid">
          A descrição é obrigatória
        </span>
      </div>

      <!-- ATIVO -->
      <div class="ativo">
        <mat-slide-toggle formControlName="ativo">
          Ativo
        </mat-slide-toggle>
      </div>

    </div>

    <!-- AÇÕES -->
    <div class="actions">

      <button type="button" class="btn-back" (click)="voltar()">
        <mat-icon>arrow_back</mat-icon>
        Voltar
      </button>

      <button type="button" class="btn-cancel" (click)="voltar()">
        Cancelar
      </button>

      <button type="submit" class="btn-save">
        Salvar
      </button>

    </div>

  </form>

</div>
