<div class="page-header">
  <div>
    <h2>Planejamento de Versões</h2>
    <p>Gerencie versões e suas tarefas</p>
  </div>
</div>

<!-- FILTROS -->
<div class="filters">

  <input type="text" placeholder="Buscar versão..." [(ngModel)]="search" (input)="applyFilters()" />

  <div class="date-filter">
    <label>Período:</label>
    <input type="date" [(ngModel)]="startDate" (change)="applyFilters()" />
    <span>até</span>
    <input type="date" [(ngModel)]="endDate" (change)="applyFilters()" />
  </div>

  <button class="btn-refresh" (click)="atualizar()">
    Atualizar
  </button>

</div>

<!-- CARDS -->
<div class="container-cards">
  <div class="version-card" *ngFor="let v of filteredVersions" (click)="selectVersion(v)"
    [class.active]="selectedVersion?.id === v.id">

    <h3>{{ v.numeroVersao }}</h3>

    <span class="status" [ngClass]="{
        planejamento: v.statusVersao === 'Planejamento',
        testes: v.statusVersao === 'EmTestes',
        liberada: v.statusVersao === 'Liberada'
      }">
      {{ v.statusVersao }}
    </span>

    <div class="tasks-count">
      {{ v.totalTarefas || 0 }} tarefas
    </div>

    <!-- CONTADORES -->

    <div class="task-stats">

      <span class="ok">
        ✔ {{ v.confirmadas || 0 }}
      </span>

      <span class="warn">
        ⭐ {{ v.desejaveis || 0 }}
      </span>

      <span class="pending">
        ⚠ {{ v.planejadas || 0 }}
      </span>

    </div>

    <div class="progress">

      <div class="progress-bar" [style.width.%]="v.percentualConclusao || 0">
      </div>

    </div>

    <div class="progress-label">
      {{ v.percentualConclusao || 0 }}%
    </div>

  </div>
</div>

<!-- COMPONENTES -->
<app-version-details *ngIf="selectedVersion" [version]="selectedVersion">
</app-version-details>

<app-version-tasks
  *ngIf="selectedVersion"
  [tasks]="tasks"
  [usuarios]="usuarios"
  [version]="selectedVersion"
  (addTask)="abrirModal()"
  (editTask)="editarTask($event)"
  (deleteTask)="excluirTask($event)">
</app-version-tasks>
