<div class="page-container">

  <!-- HEADER -->
  <div class="page-header">
    <div>
      <h2>Clientes</h2>
      <p>Gerencie os clientes cadastrados no sistema.</p>
    </div>

    <button mat-raised-button color="primary" (click)="novo()">
      <mat-icon>add</mat-icon>
      Novo Cliente
    </button>
  </div>

  <!-- FILTRO -->
  <div class="filter-card" [formGroup]="filtroForm">

    <mat-form-field appearance="outline">
      <mat-label>ID</mat-label>
      <input matInput formControlName="id" placeholder="ID">
    </mat-form-field>

    <mat-form-field appearance="outline" class="nome-field">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="nome" placeholder="Digite nome cliente">
    </mat-form-field>

    <button mat-raised-button class="btn-filtrar" (click)="filtrar()">
      Filtrar
    </button>
  </div>

  <!-- TABELA -->
  <div class="table-card">

    <table mat-table [dataSource]="dataSource">

      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let cliente">{{ cliente.id }}</td>
      </ng-container>

      <!-- Nome -->
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let cliente">{{ cliente.nome }}</td>
      </ng-container>

      <!-- Ações -->
      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef class="acoes-header">
          Ações
        </th>

        <td mat-cell *matCellDef="let cliente" class="acoes-cell">

          <div class="acoes-wrapper">
            <button mat-stroked-button color="primary" class="btn-editar" (click)="editar(cliente.id)">
              <mat-icon>edit</mat-icon>
              Editar
            </button>

            <button mat-stroked-button class="btn-excluir" (click)="excluir(cliente.id)">
              <mat-icon>delete</mat-icon>
              Excluir
            </button>
          </div>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

    <mat-paginator [pageSize]="5"></mat-paginator>

  </div>

</div>
