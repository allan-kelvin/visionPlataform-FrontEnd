<div class="page-container">

  <!-- HEADER -->
  <div class="page-header">
    <div class="title-group">
      <h2 class="neon-title">Clientes</h2>
      <p>Gerencie os clientes cadastrados no sistema.</p>
    </div>

    <button class="btn-primary" (click)="novo()">
      + Novo Cliente
    </button>
  </div>

  <!-- FILTROS -->
  <div class="card filters" [formGroup]="filtroForm">

    <div class="form-group">
      <label>ID</label>
      <input formControlName="id" placeholder="Ex: 1">
    </div>

    <div class="form-group">
      <label>Nome</label>
      <input formControlName="nome" placeholder="Digite o nome">
    </div>

    <div class="form-group button-group">
      <button class="btn-primary full" (click)="filtrar()">
        Filtrar
      </button>
    </div>

  </div>

  <!-- TABELA -->
  <div class="card table-card">

    <table mat-table [dataSource]="dataSource">

      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef (click)="sort('id')">
          ID
        </th>
        <td mat-cell *matCellDef="let cliente">{{ cliente.id }}</td>
      </ng-container>

      <!-- Nome -->
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef (click)="sort('nome')">
          Nome
        </th>
        <td mat-cell *matCellDef="let cliente">{{ cliente.nome }}</td>
      </ng-container>

      <!-- Ações -->
      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef class="actions-col">
          Ações
        </th>

        <td mat-cell *matCellDef="let cliente" class="actions-col">

          <div class="actions-wrapper">
            <button class="btn-edit" (click)="editar(cliente.id); $event.stopPropagation()">
              <mat-icon>edit</mat-icon>
              Editar
            </button>

            <button class="btn-delete" (click)="excluir(cliente.id); $event.stopPropagation()">
              <mat-icon>delete</mat-icon>
               Excluir
            </button>
          </div>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (dblclick)="onRowDoubleClick(row)"
        (click)="selectedRow(row)" [class.row-selected]="selectedRow?.id === row.id"></tr>

    </table>

    <!-- PAGINAÇÃO -->
    <mat-paginator [pageSize]="5"></mat-paginator>

  </div>

</div>
