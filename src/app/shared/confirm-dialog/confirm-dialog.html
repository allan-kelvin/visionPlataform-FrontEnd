<div class="dialog">

  <h2 class="title">
  ⚠️ {{data.title}}
  </h2>

  <p class="message">
    {{data.message}}
  </p>

  <div class="actions">

    <button
      class="btn-cancel"
      (click)="cancel()">
      Cancelar
    </button>

    <button
      class="btn-delete"
      (click)="confirm()">
      Excluir
    </button>

  </div>

</div>
