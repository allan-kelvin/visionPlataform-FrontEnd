<mat-toolbar class="header">

  <!-- SIDEBAR BUTTON -->
  <button mat-icon-button (click)="toggleSidebar.emit()">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- SEARCH -->
  <div class="search-wrapper">

    <mat-icon>search</mat-icon>

    <input
      type="text"
      placeholder="Buscar telas..."
      [(ngModel)]="search"
      (keyup.enter)="searchPage()"
    />

  </div>

  <div class="header-right">

    <!-- NOTIFICAÇÕES -->
    <button mat-icon-button class="icon-button">

      <mat-icon>notifications</mat-icon>

      <span class="badge">0</span>

    </button>

    <!-- USUÁRIO -->
    <button
      mat-button
      [matMenuTriggerFor]="menu"
      class="avatar-button"
    >

      <div class="avatar">
        {{ userInitial }}
      </div>

      <div class="user-info">
        <span class="user-name">{{ userName }}</span>
        <span class="user-role">Administrador</span>
      </div>

      <mat-icon class="arrow">expand_more</mat-icon>

    </button>

    <!-- MENU -->
    <mat-menu #menu="matMenu" class="custom-menu">

  <!-- HEADER -->
  <div class="menu-header" (click)="$event.stopPropagation()">
    <div class="avatar small">{{ userInitial }}</div>

    <div class="menu-user-info">
      <div class="menu-name">{{ userName || 'Usuário' }}</div>
      <div class="menu-email">{{ userEmail || 'email@email.com' }}</div>
    </div>
  </div>

  <mat-divider></mat-divider>

  <!-- ITENS -->
  <button mat-menu-item (click)="goToProfile()">
    <mat-icon>person</mat-icon>
    Meu perfil
  </button>

  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>
    Sair
  </button>

</mat-menu>

  </div>

</mat-toolbar>
